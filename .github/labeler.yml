# this is a config file for the github action labeler

# Add 'root' label to any root file changes
# Quotation marks are required for the leading asterisk
root:
- changed-files:
  - any-glob-to-any-file: '*'

# Add 'Documentation' label for docs/, guides/ and any Markdown file.
# NOTE: a single key must not be repeated in YAML — earlier definitions were
# silently discarded by the parser, so all patterns are consolidated here.
Documentation:
- changed-files:
  - any-glob-to-any-file:
    - docs/**
    - guides/**
    - '**/*.md'

# Add 'Tests' label to any file changes within tests/
Tests:
- changed-files:
  - any-glob-to-any-file: tests/*

# Add 'ghactions' label to workflow and workflow-adjacent changes
ghactions:
- changed-files:
  - any-glob-to-any-file:
    - .github/workflows/*
    - .github/*

# Add 'Scripts' label to any file changes within scripts/
Scripts:
- changed-files:
  - any-glob-to-any-file: scripts/*

# Add 'source' label to any change to src files within the source dir EXCEPT for the docs sub-folder
source:
- all:
  - changed-files:
    - any-glob-to-any-file: 'src/**/*'
    - all-globs-to-all-files: '!src/docs/*'

# Add 'feature' label to any PR where the head branch name starts with `feature` or has a `feature` section in the name
feature:
 - head-branch: ['^feature', 'feature']

# Add 'release' label to any PR that is opened against the `main` branch
release:
 - base-branch: 'main'
