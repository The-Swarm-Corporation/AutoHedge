documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"

github_actions:
  - changed-files:
      - any-glob-to-any-file: ".github/**"

python:
  - changed-files:
      - any-glob-to-any-file: "**/*.py"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "pyproject.toml"
          - "requirements*.txt"
