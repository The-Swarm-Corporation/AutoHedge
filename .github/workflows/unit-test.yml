name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install --no-cache-dir -r requirements.txt

    - name: Run Python unit tests
      run: python -m unittest discover -s tests -v

    - name: Verify that the Docker image builds
      run: docker build . --file Dockerfile

    - name: Re-run tests inside the built image
      run: docker run --rm autohedge:test python -m unittest discover -s tests -v
